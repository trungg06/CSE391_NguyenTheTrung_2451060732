<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trang Multimedia</title>
</head>
<body>
    <h1>Giới thiệu sản phẩm mới</h1>

    <h2>1. Hình ảnh sản phẩm</h2>
    <figure style="margin-bottom: 20px;">
        <img src="https://placehold.co/600x400" alt="Mặt trước của sản phẩm" loading="lazy" style="max-width: 100%; height: auto;">
        <figcaption>Góc chụp trực diện mặt trước</figcaption>
    </figure>

    <figure style="margin-bottom: 20px;">
        <img src="https://placehold.co/600x400" alt="Mặt sau của sản phẩm" loading="lazy" style="max-width: 100%; height: auto;">
        <figcaption>Thiết kế mặt lưng cao cấp</figcaption>
    </figure>

    <figure style="margin-bottom: 20px;">
        <img src="https://placehold.co/600x400" alt="Hộp phụ kiện đi kèm" loading="lazy" style="max-width: 100%; height: auto;">
        <figcaption>Phụ kiện đi kèm trong hộp</figcaption>
    </figure>

    <h2>2. Video trải nghiệm (Nhúng YouTube)</h2>
    <iframe width="560" height="315" src="https://www.youtube.com/embed/dQw4w9WgXcQ" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen style="max-width: 100%;"></iframe>

    <h2>3. Video giới thiệu (Host nội bộ)</h2>
    <video controls poster="https://placehold.co/600x400?text=Trailer+Video" style="max-width: 100%; height: auto;">
        <source src="trailer.mp4" type="video/mp4">
        <source src="trailer.webm" type="video/webm">
        Trình duyệt của bạn không hỗ trợ thẻ video.
    </video>

    <h2>4. Podcast / Nhạc nền</h2>
    <audio controls>
        <source src="background-music.mp3" type="audio/mpeg">
        Trình duyệt của bạn không hỗ trợ thẻ audio.
    </audio>

    <h2>5. Inline SVG Logo</h2>
    <svg width="100" height="100" xmlns="http://www.w3.org/2000/svg">
        <circle cx="50" cy="50" r="45" stroke="black" stroke-width="3" fill="#007bff" />
        <text x="50" y="55" font-size="20" text-anchor="middle" fill="white" font-family="sans-serif">TLU</text>
    </svg>
</body>
</html>
