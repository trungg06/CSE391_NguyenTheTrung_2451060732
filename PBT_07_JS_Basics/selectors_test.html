<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CSS Selectors Test</title>
    <style>
      body { font-family: sans-serif; padding: 20px; }
      .product { border: 1px solid #ccc; padding: 15px; margin-bottom: 10px; }


      /* 1. h1 */
      h1 { background-color: yellow; }

      /* 2. .price */
      .price { background-color: yellow; }

      /* 3. #app header */
      #app header { background-color: yellow; }

      /* 4. nav a:first-child */
      nav a:first-child { background-color: yellow; }

      /* 5. .product.featured h2 */
      .product.featured h2 { background-color: yellow; }

      /* 6. article > p */
      article > p { background-color: yellow; }

      /* 7. a[href="/"] */
      a[href="/"] { background-color: yellow; }

      /* 8. .top-bar.dark h1 */
      .top-bar.dark h1 { background-color: yellow; }
    </style>
  </head>
  <body>
    <div id="app">
      <header class="top-bar dark">
        <h1>ShopTLU</h1>
        <nav>
          <a href="/" class="active">Home</a>
          <a href="/products">Products</a>
          <a href="/about">About</a>
        </nav>
      </header>
      <main>
        <article class="product">
          <h2>iPhone 16</h2>
          <p class="price">25.990.000đ</p>
          <p>Mô tả sản phẩm...</p>
        </article>
        <article class="product featured">
          <h2>MacBook Pro</h2>
          <p class="price">45.990.000đ</p>
          <p>Mô tả sản phẩm...</p>
        </article>
      </main>
    </div>
  </body>
</html>
