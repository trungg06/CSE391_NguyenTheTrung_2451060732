<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Box Model Lab</title>
    <link rel="stylesheet" href="boxmodel.css">
</head>
<body>
    <h2>Phần 1: Chứng minh content-box vs border-box</h2>
    <div class="demo-wrapper">
        <div class="box box-content">Hộp 1 (content-box)</div>
        <div class="box box-border">Hộp 2 (border-box)</div>
    </div>
    
    <div style="clear: both; margin-bottom: 40px;"></div>

    <h2>Phần 2: Layout 3 cột (Tổng 1000px)</h2>
    <div class="container">
        <div class="col sidebar">Sidebar (Cột trái)</div>
        <div class="col content">Main Content (Cột giữa)</div>
        <div class="col ads">Ads (Cột phải)</div>
    </div>
</body>
</html>
