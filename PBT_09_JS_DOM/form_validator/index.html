<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Form Validator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <form id="registerForm">
        <h2>Đăng Ký</h2>
        
        <div class="form-group">
            <input type="text" id="name" placeholder="Họ và tên (2-50 ký tự)">
            <span class="status-icon"></span>
        </div>
        
        <div class="form-group">
            <input type="text" id="email" placeholder="Email">
            <div class="error-msg" id="emailError"></div>
        </div>

        <div class="form-group">
            <input type="password" id="password" placeholder="Mật khẩu">
            <div class="strength-meter"><div id="strengthBar"></div></div>
        </div>

        <div class="form-group">
            <input type="password" id="confirmPassword" placeholder="Nhập lại mật khẩu">
            <span class="status-icon"></span>
        </div>

        <div class="form-group">
            <input type="text" id="phone" placeholder="Số điện thoại" maxlength="12">
        </div>

        <button type="submit" id="submitBtn" disabled>Đăng ký</button>
    </form>

    <script src="app.js"></script>
</body>
</html>
