<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản lý Sinh viên</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Quản lý Sinh viên</h1>

        <div class="header-actions">
            <div class="stats">
                <p>Tổng số sinh viên: <span id="totalStudents">0</span></p>
                <p>Điểm trung bình lớp: <span id="averageScore">0.0</span></p>
            </div>
            <button id="btnAddStudent" class="btn btn-primary">Thêm Sinh viên</button>
        </div>

        <table class="data-table">
            <thead>
                <tr>
                    <th>Mã SV</th>
                    <th>Họ và tên</th>
                    <th>Ngày sinh</th>
                    <th>Lớp</th>
                    <th>Điểm TB</th>
                    <th>Email</th>
                    <th>Hành động</th>
                </tr>
            </thead>
            <tbody id="studentTableBody">
                </tbody>
        </table>
    </div>

    <div id="studentModal" class="modal">
        <div class="modal-content">
            <h2 id="modalTitle">Thêm Sinh viên</h2>
            <form id="studentForm">
                <input type="hidden" id="editIndex" value="-1">
                
                <div class="form-group">
                    <label for="studentId">Mã sinh viên *</label>
                    <input type="text" id="studentId" required>
                </div>
                <div class="form-group">
                    <label for="fullName">Họ và tên *</label>
                    <input type="text" id="fullName" required>
                </div>
                <div class="form-group">
                    <label for="dob">Ngày sinh *</label>
                    <input type="date" id="dob" required>
                </div>
                <div class="form-group">
                    <label for="className">Lớp học *</label>
                    <input type="text" id="className" required>
                </div>
                <div class="form-group">
                    <label for="gpa">Điểm trung bình *</label>
                    <input type="number" id="gpa" step="0.1" min="0" max="10" required>
                </div>
                <div class="form-group">
                    <label for="email">Email *</label>
                    <input type="email" id="email" required>
                </div>
                
                <div class="form-actions">
                    <button type="button" id="btnCancel" class="btn btn-secondary">Hủy</button>
                    <button type="submit" class="btn btn-primary">Lưu dữ liệu</button>
                </div>
            </form>
        </div>
    </div>

    <script src="main.js"></script>
</body>
</html>
